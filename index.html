<html><head><base href=".">
  <meta charset="UTF-8">
  <title>3D Grid MMORPG Level Editor</title>
  <style>
    body { 
      margin: 0; 
      background: #1a1a1a; 
      color: #fff;
      font-family: Arial, sans-serif;
    }
    #editor-container {
      height: 100vh;
      width: 100vw;
      position: relative;
      overflow: hidden;
    }
    #toolbar {
      width: 300px;
      max-width: 300px;
      background: rgba(51, 51, 51, 0.9);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      overflow-y: auto;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      z-index: 1000;
      transform: translateX(0);
      transition: transform 0.3s ease;
    }
    #toolbar.hidden {
      transform: translateX(-100%);
    }
    #grid-container {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #toggle-menu {
      position: fixed;
      top: 10px;
      left: 310px;
      z-index: 1001;
      background: rgba(51, 51, 51, 0.9);
      border: none;
      color: white;
      padding: 10px;
      cursor: pointer;
      border-radius: 4px;
      transition: left 0.3s ease;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #toggle-menu.menu-hidden {
      left: 10px;
    }
    .asset-item {
      padding: 10px;
      background: #444;
      margin-bottom: 10px;
      border-radius: 4px;
      cursor: pointer;
      word-break: break-word;
      position: relative;
      padding-right: 30px; /* Space for delete button */
    }
    .asset-item.selected-asset {
      background-color: #666;
    }
    .asset-preview {
      display: none;
      width: 100%;
      height: 200px;
      background: #222;
      margin-top: 10px;
      border-radius: 4px;
      position: relative;
    }
    .asset-item.expanded .asset-preview {
      display: block;
    }
    .asset-controls {
      padding: 10px;
    }
    .tool-button {
      padding: 10px;
      background: #444;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 4px;
      margin-right: 5px;
      margin-top: 5px;
    }
    .tool-button:hover {
      background: #555;
    }
    .tool-button.active {
      background: #666;
      border: 2px solid #88f;
    }
    .tool-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #debug-console {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.9);
      border: 1px solid #00ff00;
      padding: 20px;
      width: 600px;
      height: 400px;
      display: none;
      z-index: 2000;
      font-family: monospace;
      color: #00ff00;
      overflow: auto;
    }
    #debug-console.visible {
      display: block;
    }
    #debug-content {
      white-space: pre-wrap;
      font-size: 12px;
    }
    .debug-header {
      color: #00ff00;
      border-bottom: 1px solid #00ff00;
      margin-bottom: 10px;
      padding-bottom: 5px;
    }
    .menu-arrow {
      width: 20px;
      height: 20px;
      transition: transform 0.3s ease;
    }
    .menu-arrow.collapsed {
      transform: rotate(180deg);
    }
    .rotation-ui {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      margin-top: 5px;
    }
    .rotation-button {
      width: 24px;
      height: 24px;
      background: #444;
      border: 1px solid #555;
      border-radius: 4px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .rotation-button:hover {
      background: #555;
    }
    .arrow-icon {
      display: inline-block;
      width: 16px;
      height: 16px;
      transform-origin: center;
    }
    #action-history {
      max-height: 200px;
      overflow-y: auto;
    }
    #action-history div {
      padding: 5px;
      background: #333;
      margin-bottom: 5px;
      border-radius: 4px;
      font-size: 12px;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }
    .delete-asset-btn {
      position: absolute;
      right: 5px;
      top: 5px;
      background: #ff4444;
      border: none;
      color: white;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      padding: 0;
    }

    .delete-asset-btn:hover {
      background: #ff0000;
    }

    .asset-name {
      padding-right: 25px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: grab;
      padding: 3px 5px;
      background: #444;
      border-radius: 4px;
      margin: 5px 0;
      font-size: 12px;
      user-select: none;
    }

    .section-header h3 {
      margin: 0;
      font-size: 12px;
    }

    .section-header:hover {
      background: #555;
    }

    .section-content {
      max-height: 300px;
      overflow-y: auto;
      padding: 0 5px;
      margin: 0 -5px;
      scrollbar-width: thin;
      scrollbar-color: #666 #333;
      display: none;
    }

    .section-content.expanded {
      display: block;
    }

    .section-content::-webkit-scrollbar {
      width: 8px;
    }

    .section-content::-webkit-scrollbar-track {
      background: #333;
    }

    .section-content::-webkit-scrollbar-thumb {
      background-color: #666;
      border-radius: 4px;
    }

    .toolbar-section {
      position: relative;
      transition: transform 0.2s ease, background-color 0.2s ease;
      z-index: 1;
      border-radius: 4px;
      margin: 2px 0;
    }

    .toolbar-section.dragging {
      position: fixed;
      width: 280px;
      z-index: 1002;
      pointer-events: none;
    }

    .toolbar-section.drop-target {
      position: relative;
      margin-top: 20px;
      margin-bottom: 20px;
      transition: margin 0.2s ease;
    }

    .block-settings {
      padding: 10px;
      background: #444;
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .block-settings input[type="color"] {
      width: 100%;
      height: 40px;
      margin: 5px 0;
    }

    .block-item {
      padding: 10px;
      background: #444;
      margin-bottom: 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    .block-item.selected-block {
      background-color: #666;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="editor-container">
    <div id="toolbar">
      <h2>Level Editor</h2>
      
      <div class="section-header">
        <h3>Tools</h3>
        <button class="section-toggle">&#x25bc;</button>
      </div>
      <div class="section-content expanded">
        <button class="tool-button" id="place-block">Place Block</button>
        <button class="tool-button" id="remove-block">Remove Block</button>
        <button class="tool-button" id="export-json">Export JSON</button>
        <input type="file" id="import-input" accept=".json" style="display: none;">
        <button class="tool-button" id="import-json">Import JSON</button>
        <button class="tool-button" id="undo-action">Undo</button>
        <button class="tool-button" id="redo-action" disabled>Redo</button>
      </div>

      <div class="section-header">
        <h3>Grid Size: 32x32</h3>
        <button class="section-toggle">&#x25bc;</button>
      </div>
      <div class="section-content expanded">
        <div class="block-settings">
          <label>Block Color</label>
          <input type="color" id="block-color" value="#8888ff">
        </div>
      </div>

      <div class="section-header">
        <h3>Asset Library</h3>
        <button class="section-toggle">&#x25bc;</button>
      </div>
      <div class="section-content expanded">
        <input type="file" id="model-input" accept=".gltf,.glb" style="display: none;">
        <button class="tool-button" id="load-model">Load 3D Model</button>
        <div id="asset-list">
          <!-- Assets will be added here dynamically -->
        </div>
      </div>

      <div class="section-header">
        <h3>Placed Assets</h3>
        <button class="section-toggle">&#x25bc;</button>
      </div>
      <div class="section-content expanded">
        <div id="placed-assets-list">
          <!-- Placed assets will be listed here -->
        </div>
      </div>

      <div class="section-header">
        <h3>Placed Blocks</h3>
        <button class="section-toggle">&#x25bc;</button>
      </div>
      <div class="section-content expanded">
        <div id="placed-blocks-list">
          <!-- Placed blocks will be listed here -->
        </div>
      </div>

      <div class="section-header">
        <h3>Action History</h3>
        <button class="section-toggle">&#x25bc;</button>
      </div>
      <div class="section-content expanded">
        <div id="action-history">
          <!-- Actions will be listed here -->
        </div>
      </div>
    </div>
    <div id="grid-container">
    </div>
    <button id="toggle-menu">
      <svg class="menu-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
  </div>

  <div id="debug-console">
    <h3 class="debug-header">Debug Console</h3>
    <div id="debug-content"></div>
  </div>

  <script>let scene, camera, renderer, controls;
let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();
let gridBlocks = {};
let placementPreview;
let groundPlane;
let loadedModels = [];
let selectedModel = null;
let modelPreview = null;
let placedAssets = [];
let selectedPlacedAsset = null;
let assetIdCounter = 0;
let selectedBlock = null;
const loader = new THREE.GLTFLoader();
let actionHistory = [];
let redoHistory = [];
const MAX_REDO_HISTORY = 100;
let actionHistoryUI = document.getElementById('action-history');
let debugInfo = {
  mousePosition: {
    x: 0,
    y: 0
  },
  normalizedMouse: {
    x: 0,
    y: 0
  },
  raycastHit: null,
  gridPosition: null,
  cameraPosition: null,
  lastAction: null
};
let draggingSectionHeader = null;
let sections = [];
let dragStartY = 0;
let initialBlockColor = null;
async function exportLevel() {
  const levelData = {
    blocks: Object.keys(gridBlocks).map(key => {
      const [x, y, z] = key.split(',').map(Number);
      const block = gridBlocks[key];
      return {
        x,
        y,
        z,
        color: block.material.color.getHexString()
      };
    }),
    assets: placedAssets.map(asset => {
      return {
        id: asset.id,
        url: asset.url,
        name: asset.name,
        position: {
          x: asset.model.position.x,
          y: asset.model.position.y,
          z: asset.model.position.z
        },
        rotation: {
          x: asset.model.rotation.x,
          y: asset.model.rotation.y,
          z: asset.model.rotation.z
        },
        scale: {
          x: asset.model.scale.x,
          y: asset.model.scale.y,
          z: asset.model.scale.z
        }
      };
    }),
    assetLibrary: loadedModels.map(model => {
      return {
        url: model.url,
        name: model.name
      };
    }),
    actionHistory: actionHistory
  };
  const blob = new Blob([JSON.stringify(levelData, null, 2)], {
    type: 'application/json'
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'level.json';
  a.click();
  URL.revokeObjectURL(url);
  debugInfo.lastAction = `Exported Level - Blocks: ${levelData.blocks.length}, Assets: ${levelData.assets.length}, Asset Library: ${levelData.assetLibrary.length}, Action History Included: true`;
  addActionToHistory(debugInfo.lastAction);
  updateDebugInfo();
}
function importLevel(file) {
  const reader = new FileReader();
  reader.onload = function (e) {
    try {
      const levelData = JSON.parse(e.target.result);
      Object.keys(gridBlocks).forEach(key => removeBlock(key));
      gridBlocks = {};
      placedAssets.forEach(asset => {
        scene.remove(asset.model);
      });
      placedAssets = [];
      document.getElementById('placed-assets-list').innerHTML = '';
      loadedModels = [];
      document.getElementById('asset-list').innerHTML = '';
      levelData.assetLibrary.forEach(asset => {
        loadModelFromURL(asset.url, asset.name);
      });
      levelData.blocks.forEach(block => {
        const key = `${block.x},${block.y},${block.z}`;
        const newBlock = addBlock(new THREE.Vector3(block.x, block.y, block.z));
        if (block.color) {
          newBlock.material.color.set('#' + block.color);
        }
        gridBlocks[key] = newBlock;
      });
      updateBlocksList();
      let maxAssetId = -1;
      levelData.assets.forEach(assetData => {
        loader.load(assetData.url, gltf => {
          const model = gltf.scene;
          model.position.set(assetData.position.x, assetData.position.y, assetData.position.z);
          model.rotation.set(assetData.rotation.x, assetData.rotation.y, assetData.rotation.z);
          model.scale.set(assetData.scale.x, assetData.scale.y, assetData.scale.z);
          model.userData.url = assetData.url;
          model.userData.name = assetData.name;
          scene.add(model);
          const assetId = assetData.id;
          const asset = {
            id: assetId,
            model: model,
            position: model.position.clone(),
            url: assetData.url,
            name: assetData.name
          };
          placedAssets.push(asset);
          addPlacedAssetToList(asset);
        }, undefined, error => {
          console.error('Error loading asset:', error);
          debugInfo.lastAction = `Error loading asset: ${error.message}`;
          addActionToHistory(debugInfo.lastAction);
          updateDebugInfo();
        });
        if (assetData.id > maxAssetId) {
          maxAssetId = assetData.id;
        }
      });
      assetIdCounter = maxAssetId + 1;
      if (levelData.actionHistory && Array.isArray(levelData.actionHistory)) {
        actionHistory = levelData.actionHistory;
        actionHistoryUI.innerHTML = '';
        actionHistory.forEach(action => {
          const actionItem = document.createElement('div');
          actionItem.textContent = action.description;
          actionHistoryUI.appendChild(actionItem);
        });
      } else {
        actionHistory = [];
        actionHistoryUI.innerHTML = '';
      }
      debugInfo.lastAction = `Imported Level - Blocks: ${levelData.blocks.length}, Assets: ${levelData.assets.length}, Asset Library: ${levelData.assetLibrary.length}, Action History Loaded: ${levelData.actionHistory ? 'Yes' : 'No'}`;
      addActionToHistory(debugInfo.lastAction);
      updateDebugInfo();
    } catch (error) {
      console.error('Error importing level:', error);
      debugInfo.lastAction = `Error importing level: ${error.message}`;
      addActionToHistory(debugInfo.lastAction);
      updateDebugInfo();
    }
  };
  reader.readAsText(file);
}
async function loadModel(file) {
  try {
    const url = await websim.upload(file);
    const name = file.name;
    loadModelFromURL(url, name);
  } catch (error) {
    console.error('Error uploading file:', error);
    debugInfo.lastAction = `Error uploading model: ${error.message}`;
    addActionToHistory(debugInfo.lastAction);
    updateDebugInfo();
  }
}
function loadModelFromURL(url, name) {
  loader.load(url, gltf => {
    const model = gltf.scene;
    model.userData.yOffset = new THREE.Box3().setFromObject(model).min.y;
    model.userData.url = url;
    model.userData.name = name;
    const assetItem = createAssetItem(model, url, name);
    document.getElementById('asset-list').appendChild(assetItem);
    loadedModels.push({
      model: model,
      preview: assetItem.querySelector('.asset-preview'),
      url: url,
      name: name
    });
    debugInfo.lastAction = `Loaded model: ${name}`;
    addActionToHistory(debugInfo.lastAction);
    updateDebugInfo();
  }, undefined, error => {
    console.error(error);
    debugInfo.lastAction = `Error loading model: ${error.message}`;
    addActionToHistory(debugInfo.lastAction);
    updateDebugInfo();
  });
}
function createAssetItem(model, url, name) {
  const assetItem = document.createElement('div');
  assetItem.className = 'asset-item';
  assetItem.innerHTML = `
        <div class="asset-name">${name}</div>
      `;
  assetItem.addEventListener('click', () => {
    if (modelPreview) {
      scene.remove(modelPreview);
      modelPreview = null;
    }
    selectedModel = model;
    placementPreview.visible = false;
    document.querySelectorAll('.tool-button').forEach(b => b.classList.remove('active'));
    document.getElementById('place-block').classList.add('active');
    if (selectedModel) {
      if (!modelPreview) {
        modelPreview = selectedModel.clone();
        modelPreview.traverse(child => {
          if (child.material) {
            child.material = child.material.clone();
            child.material.transparent = true;
            child.material.opacity = 0.5;
          }
        });
        scene.add(modelPreview);
      }
    }
  });
  return assetItem;
}
function addPlacedAssetToList(assetData) {
  const placedAssetsList = document.getElementById('placed-assets-list');
  const assetItem = document.createElement('div');
  assetItem.className = 'asset-item';
  const deleteBtn = document.createElement('button');
  deleteBtn.className = 'delete-asset-btn';
  deleteBtn.innerHTML = '×';
  deleteBtn.onclick = e => {
    e.stopPropagation();
    deletePlacedAsset(assetData.id, true);
  };
  assetItem.innerHTML = `
    <div class="asset-name">${assetData.name} (ID: ${assetData.id})</div>
  `;
  assetItem.appendChild(deleteBtn);
  placedAssetsList.appendChild(assetItem);
  assetItem.querySelector('.asset-name').addEventListener('click', () => {
    selectPlacedAsset(assetData.id);
  });
  assetData.assetItem = assetItem;
}
function getPlacedAssetById(assetId) {
  return placedAssets.find(asset => asset.id === assetId);
}
function selectPlacedAsset(assetId) {
  const asset = getPlacedAssetById(assetId);
  if (asset) {
    if (selectedPlacedAsset) {
      deselectPlacedAsset();
    }
    selectedPlacedAsset = asset;
    const helper = new THREE.BoxHelper(asset.model, 0xffff00);
    helper.name = 'selectionHelper';
    scene.add(helper);
    asset.helper = helper;
    asset.assetItem.classList.add('selected-asset');
    showRotationUI(asset);
  }
}
function deselectPlacedAsset() {
  if (selectedPlacedAsset) {
    if (selectedPlacedAsset.helper) {
      scene.remove(selectedPlacedAsset.helper);
      selectedPlacedAsset.helper = null;
    }
    hideRotationUI(selectedPlacedAsset);
    selectedPlacedAsset.assetItem.classList.remove('selected-asset');
    selectedPlacedAsset = null;
  }
}
function showRotationUI(asset) {
  const rotationUI = document.createElement('div');
  rotationUI.className = 'rotation-ui';
  const angles = [0, 45, 90, 135, 180, 225, 270, 315];
  angles.forEach(angle => {
    const button = document.createElement('button');
    button.className = 'rotation-button';
    button.innerHTML = getArrowIcon(angle);
    button.addEventListener('click', event => {
      event.stopPropagation();
      rotatePlacedAssetToAngle(asset.id, angle);
    });
    rotationUI.appendChild(button);
  });
  asset.assetItem.appendChild(rotationUI);
  asset.rotationUI = rotationUI;
}
function hideRotationUI(asset) {
  if (asset.rotationUI) {
    asset.assetItem.removeChild(asset.rotationUI);
    asset.rotationUI = null;
  }
}
function getArrowIcon(angle) {
  return `<span class="arrow-icon" style="transform: rotate(${angle}deg);">&#9650;</span>`;
}
function rotatePlacedAssetToAngle(assetId, angle) {
  const asset = getPlacedAssetById(assetId);
  if (asset) {
    const previousRotation = asset.model.rotation.y;
    asset.model.rotation.y = THREE.Math.degToRad(angle);
    if (asset.helper) {
      asset.helper.update();
    }
    debugInfo.lastAction = `Rotated asset ${assetId} to ${angle} degrees`;
    addActionToHistory(debugInfo.lastAction, {
      type: 'rotateAsset',
      assetId: assetId,
      previousRotation: previousRotation,
      newRotation: asset.model.rotation.y
    });
    updateDebugInfo();
  }
}
function deletePlacedAsset(assetId, recordAction = true) {
  const asset = getPlacedAssetById(assetId);
  if (asset) {
    if (asset.helper) {
      scene.remove(asset.helper);
    }
    scene.remove(asset.model);
    asset.assetItem.parentNode.removeChild(asset.assetItem);
    const index = placedAssets.findIndex(a => a.id === assetId);
    if (index !== -1) {
      placedAssets.splice(index, 1);
    }
    if (selectedPlacedAsset && selectedPlacedAsset.id === assetId) {
      deselectPlacedAsset();
    }
    debugInfo.lastAction = `Deleted asset ${assetId}`;
    if (recordAction) {
      addActionToHistory(debugInfo.lastAction, {
        type: 'deleteAsset',
        assetData: {
          id: asset.id,
          url: asset.url,
          name: asset.name,
          position: {
            x: asset.model.position.x,
            y: asset.model.position.y,
            z: asset.model.position.z
          },
          rotation: {
            x: asset.model.rotation.x,
            y: asset.model.rotation.y,
            z: asset.model.rotation.z
          },
          scale: {
            x: asset.model.scale.x,
            y: asset.model.scale.y,
            z: asset.model.scale.z
          }
        }
      });
    }
    updateDebugInfo();
  }
}
function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({
    antialias: true
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.getElementById('grid-container').appendChild(renderer.domElement);
  camera.position.set(0, 32, 32);
  camera.lookAt(new THREE.Vector3(0, 0, 0));
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  const groundGeometry = new THREE.PlaneGeometry(32, 32);
  const groundMaterial = new THREE.MeshBasicMaterial({
    visible: false,
    side: THREE.DoubleSide
  });
  groundPlane = new THREE.Mesh(groundGeometry, groundMaterial);
  groundPlane.rotation.x = -Math.PI / 2;
  groundPlane.position.set(0, 0, 0);
  scene.add(groundPlane);
  const gridHelper = new THREE.GridHelper(32, 32);
  gridHelper.position.set(0, 0, 0);
  scene.add(gridHelper);
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);
  const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
  directionalLight.position.set(10, 20, 10);
  scene.add(directionalLight);
  const previewGeometry = new THREE.BoxGeometry(1, 0.5, 1);
  const previewMaterial = new THREE.MeshBasicMaterial({
    color: 0x00ff00,
    transparent: true,
    opacity: 0.5,
    wireframe: true
  });
  placementPreview = new THREE.Mesh(previewGeometry, previewMaterial);
  placementPreview.visible = false;
  scene.add(placementPreview);
  renderer.domElement.addEventListener('mousemove', onMouseMove);
